<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Dashboard · Demo</title>
  <meta name="description" content="Demo of a sales dashboard built for a manufacturer: sales by salesperson, credit notes, map, KPIs, Excel and PowerPoint export. Fictional data.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script>
    // Saved choice, else the OS preference.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
